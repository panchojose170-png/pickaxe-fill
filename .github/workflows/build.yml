name: Compilar mod

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MC_VERSION: "26.3"
    steps:
      - uses: actions/checkout@v4

      - name: Abrir codigo.zip
        run: unzip -o codigo.zip

      - name: Buscar versiones de Fabric
        run: |
          LOADER=$(curl -s "https://meta.fabricmc.net/v2/versions/loader/$MC_VERSION" | jq -r '[.[] | select(.loader.stable==true)][0].loader.version')
          API=$(curl -s -G -A "pickaxefill-build" "https://api.modrinth.com/v2/project/fabric-api/version" --data-urlencode "game_versions=[\"$MC_VERSION\"]" --data-urlencode 'loaders=["fabric"]' | jq -r '.[0].version_number')
          echo "Loader: $LOADER"
          echo "Fabric API: $API"
          if [ -z "$LOADER" ] || [ "$LOADER" = "null" ] || [ -z "$API" ] || [ "$API" = "null" ]; then
            echo "No se pudieron encontrar las versiones para $MC_VERSION"
            exit 1
          fi
          {
            echo "minecraft_version=$MC_VERSION"
            echo "loader_version=$LOADER"
            echo "fabric_api_version=$API"
          } >> gradle.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compilar
        shell: bash
        run: gradle build 2>&1 | tee build.log

      - name: Resumen de errores
        if: failure()
        shell: bash
        run: |
          {
            echo "## Errores de compilacion"
            echo '```'
            grep -E -A2 'error:|What went wrong' build.log | head -150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el .jar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: Pickaxe Fill (build ${{ github.run_number }})
          files: build/libs/pickaxefill-1.0.0.jar
