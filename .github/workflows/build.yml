name: Compilar mod

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MC_VERSION: "26.3"
    steps:
      - uses: actions/checkout@v4

      - name: Crear el proyecto del mod
        run: |
          set -e
          cat > settings.gradle <<'PICKEOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'pickaxefill'
          PICKEOF
          cat > build.gradle <<'PICKEOF'
          plugins {
              id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              implementation "net.fabricmc:fabric-loader:${project.loader_version}"
              implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }

          tasks.withType(JavaCompile).configureEach {
              options.release = 25
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
          }
          PICKEOF
          cat > gradle.properties <<'PICKEOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          mod_version=1.0.0
          maven_group=mx.pickaxefill
          archives_base_name=pickaxefill
          PICKEOF
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'PICKEOF'
          {
            "schemaVersion": 1,
            "id": "pickaxefill",
            "version": "1.0.0",
            "name": "Pickaxe Fill",
            "description": "Marca dos bloques con click derecho usando un pico y borra el área entre ellos, bloque por bloque, gastando durabilidad.",
            "authors": ["Tú"],
            "license": "MIT",
            "icon": "assets/pickaxefill/icon.png",
            "environment": "*",
            "entrypoints": {
              "main": ["mx.pickaxefill.PickaxeFill"]
            },
            "depends": {
              "fabricloader": ">=0.16.0",
              "fabric-api": "*"
            }
          }
          PICKEOF
          mkdir -p src/main/java/mx/pickaxefill
          cat > src/main/java/mx/pickaxefill/PickaxeFill.java <<'PICKEOF'
          package mx.pickaxefill;

          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.Map;
          import java.util.UUID;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.fabricmc.fabric.api.event.player.UseBlockCallback;
          import net.fabricmc.fabric.api.networking.v1.ServerPlayConnectionEvents;
          import net.minecraft.core.BlockPos;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.tags.ItemTags;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.item.ItemStack;

          /**
           * Pickaxe Fill:
           * 1) Click derecho (el mismo que abre cofres) con un pico en la mano sobre un bloque = punto 1.
           * 2) Click derecho sobre otro bloque = punto 2, y empieza a minar el área bloque por bloque.
           * Agáchate (shift) + click derecho para cancelar.
           */
          public class PickaxeFill implements ModInitializer {
              /** Tope de seguridad para no colgar el servidor con áreas enormes. */
              public static final int MAX_BLOCKS = 100_000;

              private final Map<UUID, BlockPos> firstPoint = new HashMap<>();
              private final Map<UUID, ServerLevel> firstPointLevel = new HashMap<>();
              private final Map<UUID, FillJob> jobs = new HashMap<>();

              public static boolean isPickaxe(ItemStack stack) {
                  return stack.is(ItemTags.PICKAXES);
              }

              @Override
              public void onInitialize() {
                  UseBlockCallback.EVENT.register((player, level, hand, hit) -> {
                      if (hand != InteractionHand.MAIN_HAND) return InteractionResult.PASS;
                      if (!isPickaxe(player.getMainHandItem())) return InteractionResult.PASS;

                      // En el cliente solo devolvemos SUCCESS para que no se abra el cofre/puerta
                      if (!(player instanceof ServerPlayer sp)) {
                          return InteractionResult.SUCCESS;
                      }

                      ServerLevel sl = (ServerLevel) level;
                      UUID id = sp.getUUID();
                      BlockPos clicked = hit.getBlockPos();

                      // Shift + click: cancelar todo
                      if (sp.isShiftKeyDown()) {
                          FillJob running = jobs.remove(id);
                          if (running != null) running.stop("Cancelado.");
                          firstPoint.remove(id);
                          firstPointLevel.remove(id);
                          sp.displayClientMessage(Component.literal("Marcas borradas."), true);
                          return InteractionResult.SUCCESS;
                      }

                      if (jobs.containsKey(id)) {
                          sp.displayClientMessage(
                                  Component.literal("Ya hay un área minándose. Shift + click derecho para cancelar."), true);
                          return InteractionResult.SUCCESS;
                      }

                      BlockPos p1 = firstPoint.get(id);
                      if (p1 == null || firstPointLevel.get(id) != sl) {
                          firstPoint.put(id, clicked.immutable());
                          firstPointLevel.put(id, sl);
                          sp.displayClientMessage(Component.literal(
                                  "Punto 1: " + clicked.getX() + ", " + clicked.getY() + ", " + clicked.getZ()), true);
                          return InteractionResult.SUCCESS;
                      }

                      // Segundo punto
                      long dx = Math.abs(p1.getX() - clicked.getX()) + 1L;
                      long dy = Math.abs(p1.getY() - clicked.getY()) + 1L;
                      long dz = Math.abs(p1.getZ() - clicked.getZ()) + 1L;
                      if (dx * dy * dz > MAX_BLOCKS) {
                          sp.displayClientMessage(Component.literal(
                                  "Área demasiado grande (máximo " + MAX_BLOCKS + " bloques)."), true);
                          firstPoint.remove(id);
                          firstPointLevel.remove(id);
                          return InteractionResult.SUCCESS;
                      }

                      FillJob job = new FillJob(sp, sl, p1, clicked.immutable());
                      jobs.put(id, job);
                      firstPoint.remove(id);
                      firstPointLevel.remove(id);
                      sp.displayClientMessage(Component.literal("Minando " + job.size() + " bloques..."), true);
                      return InteractionResult.SUCCESS;
                  });

                  ServerTickEvents.END_SERVER_TICK.register(server -> {
                      Iterator<Map.Entry<UUID, FillJob>> it = jobs.entrySet().iterator();
                      while (it.hasNext()) {
                          FillJob job = it.next().getValue();
                          job.tick();
                          if (job.isFinished()) it.remove();
                      }
                  });

                  ServerPlayConnectionEvents.DISCONNECT.register((handler, server) -> {
                      UUID id = handler.getPlayer().getUUID();
                      FillJob job = jobs.remove(id);
                      if (job != null) job.stop("");
                      firstPoint.remove(id);
                      firstPointLevel.remove(id);
                  });
              }
          }
          PICKEOF
          mkdir -p src/main/java/mx/pickaxefill
          cat > src/main/java/mx/pickaxefill/FillJob.java <<'PICKEOF'
          package mx.pickaxefill;

          import java.util.ArrayList;
          import java.util.List;

          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Direction;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.level.block.SoundType;
          import net.minecraft.world.level.block.state.BlockState;

          /**
           * Trabajo de minado progresivo: cada bloque tarda TICKS_PER_BLOCK ticks
           * (20 ticks = 1 segundo), con grietas y sonidos normales.
           */
          public class FillJob {
              public static final int TICKS_PER_BLOCK = 20;

              private final ServerPlayer player;
              private final ServerLevel level;
              private final List<BlockPos> queue;
              private int index = 0;
              private int ticksOnBlock = 0;
              private boolean finished = false;

              public FillJob(ServerPlayer player, ServerLevel level, BlockPos a, BlockPos b) {
                  this.player = player;
                  this.level = level;
                  this.queue = buildQueue(player, a, b);
              }

              public int size() {
                  return queue.size();
              }

              public boolean isFinished() {
                  return finished;
              }

              /**
               * Orden de rotura:
               * - Si el área es más ancha que alta: filas horizontales, de izquierda a derecha,
               *   subiendo nivel por nivel.
               * - Si es más alta que ancha: columnas verticales, de abajo hacia arriba hasta el tope,
               *   avanzando hacia la derecha.
               * "Izquierda/derecha" se cuentan desde hacia dónde mira el jugador al marcar el segundo punto.
               */
              private static List<BlockPos> buildQueue(ServerPlayer player, BlockPos a, BlockPos b) {
                  int minX = Math.min(a.getX(), b.getX()), maxX = Math.max(a.getX(), b.getX());
                  int minY = Math.min(a.getY(), b.getY()), maxY = Math.max(a.getY(), b.getY());
                  int minZ = Math.min(a.getZ(), b.getZ()), maxZ = Math.max(a.getZ(), b.getZ());

                  Direction facing = player.getDirection(); // N/S/E/O horizontal
                  Direction right = facing.getClockWise();  // derecha del jugador
                  Direction forward = facing;

                  // Ejes del área vistos desde el jugador
                  int widthSize = Math.abs(right.getStepX()) == 1 ? (maxX - minX + 1) : (maxZ - minZ + 1);
                  int depthSize = Math.abs(forward.getStepX()) == 1 ? (maxX - minX + 1) : (maxZ - minZ + 1);
                  int heightSize = maxY - minY + 1;

                  // Posición inicial en cada eje horizontal según la dirección
                  int rightStart = right.getStepX() + right.getStepZ() > 0
                          ? (Math.abs(right.getStepX()) == 1 ? minX : minZ)
                          : (Math.abs(right.getStepX()) == 1 ? maxX : maxZ);
                  int forwardStart = forward.getStepX() + forward.getStepZ() > 0
                          ? (Math.abs(forward.getStepX()) == 1 ? minX : minZ)
                          : (Math.abs(forward.getStepX()) == 1 ? maxX : maxZ);

                  boolean rows = widthSize >= heightSize;
                  List<BlockPos> list = new ArrayList<>(widthSize * depthSize * heightSize);

                  // Capas de profundidad (de cerca a lejos), y dentro de cada capa el orden pedido
                  for (int d = 0; d < depthSize; d++) {
                      if (rows) {
                          for (int h = 0; h < heightSize; h++) {
                              for (int w = 0; w < widthSize; w++) {
                                  list.add(pos(minY + h, rightStart, w, right, forwardStart, d, forward));
                              }
                          }
                      } else {
                          for (int w = 0; w < widthSize; w++) {
                              for (int h = 0; h < heightSize; h++) {
                                  list.add(pos(minY + h, rightStart, w, right, forwardStart, d, forward));
                              }
                          }
                      }
                  }
                  return list;
              }

              private static BlockPos pos(int y, int rightStart, int w, Direction right,
                                          int forwardStart, int d, Direction forward) {
                  int x = 0, z = 0;
                  // Eje del "right"
                  if (Math.abs(right.getStepX()) == 1) {
                      x = rightStart + w * right.getStepX();
                  } else {
                      z = rightStart + w * right.getStepZ();
                  }
                  // Eje del "forward"
                  if (Math.abs(forward.getStepX()) == 1) {
                      x = forwardStart + d * forward.getStepX();
                  } else {
                      z = forwardStart + d * forward.getStepZ();
                  }
                  return new BlockPos(x, y, z);
              }

              /** Se llama una vez por tick del servidor. */
              public void tick() {
                  if (finished) return;

                  ItemStack tool = player.getMainHandItem();
                  if (!player.isAlive() || !PickaxeFill.isPickaxe(tool)) {
                      stop("Se detuvo: ya no tienes el pico en la mano.");
                      return;
                  }

                  // Saltar bloques que no se pueden o no se deben romper
                  while (index < queue.size()) {
                      BlockPos pos = queue.get(index);
                      BlockState state = level.getBlockState(pos);
                      if (state.isAir() || state.getDestroySpeed(level, pos) < 0
                              || !tool.isCorrectToolForDrops(state)) {
                          index++;
                          ticksOnBlock = 0;
                          continue;
                      }
                      break;
                  }

                  if (index >= queue.size()) {
                      stop("Listo.");
                      return;
                  }

                  BlockPos pos = queue.get(index);
                  BlockState state = level.getBlockState(pos);
                  SoundType sound = state.getSoundType();

                  ticksOnBlock++;

                  // Grietas: etapa 0..9 según el progreso
                  int stage = Math.min(9, (ticksOnBlock * 10) / TICKS_PER_BLOCK);
                  level.destroyBlockProgress(player.getId(), pos, stage);

                  // Sonido de picado cada 4 ticks, como al minar normal
                  if (ticksOnBlock % 4 == 0) {
                      level.playSound(null, pos, sound.getHitSound(), SoundSource.BLOCKS,
                              (sound.getVolume() + 1.0F) / 8.0F, sound.getPitch() * 0.5F);
                  }

                  if (ticksOnBlock >= TICKS_PER_BLOCK) {
                      level.destroyBlockProgress(player.getId(), pos, -1);
                      // true = suelta los bloques (solo llegamos aquí si el pico es suficiente)
                      level.destroyBlock(pos, true, player);
                      // Desgaste: 1 de durabilidad por bloque roto
                      tool.hurtAndBreak(1, player, EquipmentSlot.MAINHAND);
                      index++;
                      ticksOnBlock = 0;
                  }
              }

              public void stop(String message) {
                  if (finished) return;
                  finished = true;
                  if (index < queue.size()) {
                      level.destroyBlockProgress(player.getId(), queue.get(index), -1);
                  }
                  player.displayClientMessage(Component.literal(message), true);
              }
          }
          PICKEOF
          mkdir -p src/main/resources/assets/pickaxefill
          base64 -d > src/main/resources/assets/pickaxefill/icon.png <<'PICKEOF'
          iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmHLAAADh0lEQVR4Xu2dIYsVUQBG18WwmB5i
          WMQkpmUxGLQsYhKTmAz+BG3aFGzatKn/wGw0mERERQwqm/TlDYbF9LAo+APuCZeH4Dmn3jdvZu4c
          7vJ9M/P2yNmz535vhJZN7ZnHXxJATgLISQA5CSAnAeQkgJyjdP47Ozv0kSFbW1vD8dVqNRxfLBbD
          8cPDw7Xun46f9r+9vT11/jQ/NL5cLof7bwWQkwByEkBOAshJADkJICcB5GAPMJuDZ6GcTcc3O35w
          cDA8Bcr5BJ0fQT0J0QogJwHkJICcBJCTAHISQE4CyMEegO43E5RTZ3P29WeP6RCG3P/yfWr7xeNH
          w+0p59P8UI8xSyuAnASQkwByEkBOAshJADkJIGftPcC6c/6NZ8//7SW8fWe4/1MPH0z1BPS8Ac0v
          0QogJwHkJICcBJCTAHISQE4CyMEegO5H0/1syqlfb94aXoIXkPOvff44lbPp/Oh+/jsS6O694Sd2
          nz6hbxhCPUG/DxBD+hMgJwHkJICcBJCTAHISQA72AJTz1w3lfOoZKCfPbn/lw5vhFLykCYIe5Ay8
          dzBLK4CcBJCTAHISQE4CyEkAOQkgB3sAuh9OPQGNv3vzfngJTsDv9NH9fPp9A+oJzqzeDo/v8/LH
          cPwKCPZt78LwE3R+s7QCyEkAOQkgJwHkJICcBJCTAHKwB6AcP9sT0P3+Q/i/g5STqQfY3fg0lfM3
          T18ebk/7/wY9yCn4v4iztALISQA5CSAnAeQkgJwEkJMAcrAHoJxPOZe2Jyjn0/hszv95/Pz4ECGn
          0/MGl16/oikYQj0N0QogJwHkJICcBJCTAHISQE4CyMEegHImvV9PUI6nnmE25x/buTo8xM3VajhO
          xzc7TvM/27O0AshJADkJICcB5CSAnASQkwBysAdYd86nHLu3WA4vEb2fP/vcPkE5nXoA2p56Epo/
          ohVATgLISQA5CSAnAeQkgJwEkIM9AEHPvVOPMJvz6X4+7Z+gHE5QDzD7/dQjEK0AchJATgLISQA5
          CSAnAeQkgBzsASjn0/3o2Zz/6+TF4SX6Nfl+/mxOp+0pp1NPQT0BfT/RCiAnAeQkgJwEkJMAchJA
          TgLIwR6Acj7l1K8b54ZTvHkargC8n0/7Xzc0P5TTaZx6Bto/0QogJwHkJICcBJCTAHISQE4CyMEe
          YH9/Xz5F/zetAHISQE4CyEkAOQkgJwHkJICcP08F+yZu/Jn0AAAAAElFTkSuQmCC
